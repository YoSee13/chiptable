<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>חצי־חצי</title>
<meta name="description" content="מחלקים הוצאות בין חברים: קבוצות, כמה מטבעות, יתרות וסגירת חשבון במינימום העברות.">
<meta name="theme-color" content="#f3f2f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0b12" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="חצי־חצי">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Heebo:wght@400;500;600;700&display=swap">
<style>
/* One mobile column; gradient "hero" cards carry the money, everything else is quiet. Bottom sheets hold every form.
   All colors are tokens with a dark variant. */
:root {
  --bg: #f3f2f9; --card: #ffffff; --fill: #eceaf6; --line: #e4e1f0;
  --ink: #14121f; --muted: #757189; --pri: #6a4dff; --pri-ink: #fff; --pri-soft: #ebe7ff;
  --pos: #0c9a5e; --pos-bg: #dcf6e8; --neg: #e0335a; --neg-bg: #ffe2e9;
  --grad: linear-gradient(135deg, #6a4dff 0%, #b44dff 50%, #ff5c8a 100%);
  --shadow: 0 8px 28px rgba(60, 40, 140, .09); --shadow-pri: 0 12px 30px rgba(120, 77, 255, .42);
  --f: "Heebo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --fd: "Fredoka", "Heebo", system-ui, sans-serif;
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0c0b12; --card: #181622; --fill: #221f30; --line: #2b2839;
    --ink: #f5f3ff; --muted: #9a96ad; --pri: #9482ff; --pri-ink: #fff; --pri-soft: #262046;
    --pos: #4fdc9c; --pos-bg: #12301f; --neg: #ff7a95; --neg-bg: #3a1722;
    --shadow: 0 8px 28px rgba(0, 0, 0, .4); --shadow-pri: 0 12px 30px rgba(120, 77, 255, .35);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f); font-size: 16px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
:focus-visible { outline: 2.5px solid var(--pri); outline-offset: 2px; }
.n { direction: ltr; unicode-bidi: isolate; display: inline-block; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.pos { color: var(--pos); } .neg { color: var(--neg); }
.ic { width: 22px; height: 22px; flex: none; }

.shell {
  max-width: 560px; margin: 0 auto; min-height: 100%;
  padding: calc(env(safe-area-inset-top, 0px) + 14px) max(16px, env(safe-area-inset-right, 0px)) 140px max(16px, env(safe-area-inset-left, 0px));
}
.top { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; min-height: 48px; }
.top h1 { font-family: var(--fd); font-weight: 600; font-size: 24px; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.brand svg { width: 44px; height: 44px; border-radius: 14px; flex: none; }
.brand small { display: block; color: var(--muted); font-size: 13px; line-height: 1.2; }
.brand b { font-family: var(--fd); font-weight: 600; font-size: 22px; line-height: 1.15; }
.ib {
  width: 46px; height: 46px; border-radius: 16px; background: var(--card); box-shadow: var(--shadow);
  display: grid; place-items: center; flex: none; transition: transform .25s var(--spring);
}
.ib:active, .btn:active, .fab:active, .chip:active, .row:active, .gcard:active, .pad button:active, .amt:active { transform: scale(.94); }

/* hero: the one loud element per screen */
.hero {
  position: relative; overflow: hidden; color: #fff; border-radius: 30px; padding: 24px 22px 20px; margin-bottom: 22px;
  background: radial-gradient(120% 130% at 100% 0%, #ff6aa0 0%, transparent 55%), radial-gradient(100% 100% at 0% 100%, #3f7bff 0%, transparent 60%), linear-gradient(135deg, #6a4dff, #a14dff);
  box-shadow: var(--shadow-pri);
}
.hero::before, .hero::after { content: ""; position: absolute; border-radius: 50%; background: rgba(255, 255, 255, .12); pointer-events: none; }
.hero::before { width: 190px; height: 190px; inset: -70px auto auto -50px; }
.hero::after { width: 110px; height: 110px; inset: auto 24px -50px auto; background: rgba(255, 255, 255, .09); }
.hero > * { position: relative; z-index: 1; }
.hero small { opacity: .85; font-size: 14px; font-weight: 500; }
.hero .big { font-family: var(--fd); font-weight: 600; font-size: 54px; line-height: 1.1; margin: 2px 0 14px; }
.hero .split { display: flex; gap: 10px; }
.glass { flex: 1; background: rgba(255, 255, 255, .17); border: 1px solid rgba(255, 255, 255, .22); border-radius: 18px; padding: 10px 14px; font-size: 13px; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.glass b { display: block; font-family: var(--fd); font-weight: 600; font-size: 20px; }
.hero + .hero { margin-top: -10px; }

h2 { font-family: var(--fd); font-size: 18px; font-weight: 600; margin: 24px 4px 12px; }
.card { background: var(--card); border-radius: 24px; padding: 16px; box-shadow: var(--shadow); }

.gcard {
  display: flex; align-items: center; gap: 14px; width: 100%; text-align: start; background: var(--card);
  border-radius: 24px; padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow); transition: transform .25s var(--spring);
  animation: rise .4s both; animation-delay: calc(var(--i, 0) * 50ms);
}
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
.tile { width: 54px; height: 54px; border-radius: 18px; display: grid; place-items: center; font-size: 27px; flex: none; background: var(--fill); }
.tile.g { background: linear-gradient(135deg, var(--g1), var(--g2)); box-shadow: 0 6px 14px color-mix(in srgb, var(--g1) 35%, transparent); }
.gcard .mid { flex: 1; min-width: 0; }
.gcard .mid b { display: block; font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
.stack { display: flex; align-items: center; }
.stack .av { width: 24px; height: 24px; font-size: 11px; border: 2px solid var(--card); margin-inline-end: -7px; }
.stack small { margin-inline-start: 13px; color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill { font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 14px; background: var(--fill); color: var(--muted); white-space: nowrap; text-align: center; }
.pill.pos { background: var(--pos-bg); color: var(--pos); } .pill.neg { background: var(--neg-bg); color: var(--neg); }
.pill small { display: block; font-weight: 500; font-size: 11px; opacity: .85; }
.pill .n { font-family: var(--fd); font-size: 15px; }

.fabwrap { position: fixed; inset: auto 0 0 0; padding: 30px 0 calc(env(safe-area-inset-bottom, 0px) + 18px); text-align: center; z-index: 5; pointer-events: none; background: linear-gradient(to top, var(--bg) 35%, transparent); }
.fab {
  pointer-events: auto; display: inline-flex; align-items: center; gap: 8px; background: var(--grad); color: #fff; font-family: var(--fd); font-weight: 600; font-size: 18px;
  padding: 15px 26px 15px 22px; border-radius: 99px; box-shadow: var(--shadow-pri); transition: transform .25s var(--spring);
}
.fab .ic { width: 24px; height: 24px; stroke-width: 2.8; }
.empty { text-align: center; padding: 26px 10px; color: var(--muted); }
.empty svg { width: 120px; height: 120px; border-radius: 34px; margin-bottom: 14px; box-shadow: var(--shadow-pri); animation: bob 3s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-7px) rotate(-3deg); } }
.empty b { display: block; color: var(--ink); font-family: var(--fd); font-size: 21px; margin-bottom: 4px; }

/* group */
.gsum { display: flex; gap: 10px; align-items: stretch; background: linear-gradient(135deg, var(--g1), var(--g2)); color: #fff; border-radius: 28px; padding: 18px; margin-bottom: 14px; box-shadow: 0 12px 28px color-mix(in srgb, var(--g1) 38%, transparent); position: relative; overflow: hidden; }
.gsum::before { content: ""; position: absolute; width: 150px; height: 150px; border-radius: 50%; background: rgba(255, 255, 255, .13); inset: -60px auto auto -40px; }
.gsum .stat { flex: 1; position: relative; }
.gsum .stat small { font-size: 13px; opacity: .88; display: block; font-weight: 500; }
.gsum .stat b { font-family: var(--fd); font-weight: 600; font-size: 28px; line-height: 1.2; }
.gsum .stat.glass { flex: 0 1 46%; }
.gsum .stat.glass b { font-size: 22px; }
.tabs, .seg { display: flex; background: var(--fill); border-radius: 18px; padding: 4px; }
.tabs { margin-bottom: 14px; }
.tabs button, .seg button { flex: 1; padding: 10px 4px; border-radius: 14px; font-weight: 600; color: var(--muted); font-size: 15px; transition: background .2s, color .2s; }
.tabs button.on, .seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 2px 8px rgba(0, 0, 0, .1); }
.day { font-size: 13px; font-weight: 600; color: var(--muted); margin: 18px 6px 8px; }
.row {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: start; padding: 12px; background: var(--card);
  border-radius: 22px; margin-bottom: 8px; box-shadow: var(--shadow); transition: transform .25s var(--spring); animation: rise .35s both; animation-delay: calc(var(--i, 0) * 30ms);
}
.row .tile { width: 48px; height: 48px; font-size: 23px; border-radius: 16px; }
.row .mid { flex: 1; min-width: 0; }
.row .mid b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .mid span, .row .end span { font-size: 13px; color: var(--muted); }
.row .end { text-align: end; flex: none; }
.row .end b { display: block; font-family: var(--fd); font-weight: 600; font-size: 17px; }
.row.pay { background: transparent; box-shadow: none; border: 1.5px dashed var(--line); }

.av { width: 36px; height: 36px; border-radius: 50%; display: inline-grid; place-items: center; color: #fff; font-weight: 700; font-size: 15px; flex: none; }
.brow { display: flex; align-items: center; gap: 12px; padding: 9px 0; }
.brow .mid { flex: 1; min-width: 0; }
.brow .nm { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; font-size: 15px; }
.brow .nm .n { font-family: var(--fd); }
.track { height: 10px; background: var(--fill); border-radius: 10px; margin-top: 6px; overflow: hidden; }
.track i { display: block; height: 100%; border-radius: 10px; width: 0; transition: width .8s cubic-bezier(.2, .8, .2, 1); }
.tr { display: flex; align-items: center; gap: 8px; padding: 13px 0; border-top: 1px solid var(--line); }
.tr:first-child { border-top: 0; }
.tr .who { flex: 1; min-width: 0; font-size: 14.5px; line-height: 1.3; }
.tr .who b { font-family: var(--fd); font-weight: 600; font-size: 20px; display: block; }
.arrow { color: var(--muted); font-size: 18px; }
.btn { background: var(--ink); color: var(--bg); font-weight: 600; padding: 12px 18px; border-radius: 16px; transition: transform .25s var(--spring); white-space: nowrap; }
.btn.acc { background: var(--grad); color: #fff; box-shadow: var(--shadow-pri); }
.btn.ghost { background: var(--fill); color: var(--ink); }
.btn.danger { background: var(--neg-bg); color: var(--neg); }
.btn.wide { width: 100%; padding: 16px; font-family: var(--fd); font-size: 18px; border-radius: 20px; }
.btn.sm { padding: 9px 14px; font-size: 14px; border-radius: 13px; box-shadow: none; }

.donut { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; justify-content: center; }
.donut svg { width: 170px; height: 170px; flex: none; }
.legend { flex: 1; min-width: 150px; font-size: 14px; }
.legend div { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
.legend i { width: 10px; height: 10px; border-radius: 4px; flex: none; }
.legend span { flex: 1; }

/* sheets */
.back { position: fixed; inset: 0; background: rgba(12, 8, 30, .5); z-index: 20; opacity: 0; transition: opacity .25s; -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
.back.on { opacity: 1; }
.sheet {
  position: fixed; inset: auto 0 0 0; margin: 0 auto; max-width: 560px; max-height: 93dvh; overflow-y: auto; z-index: 21; background: var(--bg);
  border-radius: 34px 34px 0 0; padding: 10px 18px calc(env(safe-area-inset-bottom, 0px) + 22px); transform: translateY(105%);
  transition: transform .4s cubic-bezier(.2, .9, .25, 1); overscroll-behavior: contain;
}
.sheet.on { transform: none; }
.sheet::before { content: ""; display: block; width: 44px; height: 5px; border-radius: 5px; background: var(--line); margin: 0 auto 12px; }
.sheet h3 { font-family: var(--fd); font-weight: 600; font-size: 24px; margin: 0 0 14px; }
.sheet label, .lbl { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 18px 4px 8px; }
.in { width: 100%; background: var(--card); border: 2px solid transparent; border-radius: 16px; padding: 13px 14px; font-size: 16px; outline: 0; box-shadow: var(--shadow); transition: border-color .15s; }
.in:focus { border-color: var(--pri); }

/* amount + keypad */
.amt { display: flex; align-items: baseline; justify-content: center; gap: 8px; direction: ltr; width: 100%; padding: 6px 0 10px; font-family: var(--fd); font-weight: 600; transition: transform .25s var(--spring); }
.amt .cur { font-size: 30px; color: var(--pri); }
.amt .v { font-size: 64px; line-height: 1.1; }
.amt.empty .v { color: var(--muted); opacity: .5; }
.amt .v.pop { animation: pop .18s var(--spring); }
@keyframes pop { from { transform: scale(1.13); } }
.rate { display: flex; align-items: center; justify-content: center; gap: 8px; direction: ltr; margin-top: 10px; font-weight: 600; }
.rate .in { width: 110px; padding: 9px 10px; text-align: center; font-family: var(--fd); }
.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; direction: ltr; margin-top: 14px; }
.pad button { height: 58px; border-radius: 18px; background: var(--card); box-shadow: var(--shadow); font-family: var(--fd); font-weight: 600; font-size: 26px; display: grid; place-items: center; transition: transform .2s var(--spring), background .1s; }
.pad button:active { background: var(--pri-soft); }
.pad .ok { grid-column: 1 / -1; height: 50px; background: var(--pri-soft); color: var(--pri); font-size: 17px; box-shadow: none; }

.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; margin-inline: -18px; padding: 4px 18px 10px; scrollbar-width: none; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chips.mid { justify-content: center; }
.chip {
  display: inline-flex; align-items: center; gap: 7px; background: var(--card); border: 2px solid transparent; border-radius: 99px; box-shadow: var(--shadow);
  padding: 8px 14px; font-weight: 500; white-space: nowrap; transition: transform .25s var(--spring), background .15s, color .15s; flex: none;
}
.chip.on { background: var(--pri); color: #fff; box-shadow: 0 6px 16px rgba(120, 77, 255, .35); }
.chip .av { width: 22px; height: 22px; font-size: 11px; }
.chip small { opacity: .7; font-size: 11px; }
.chip.emo { font-size: 25px; padding: 0; width: 52px; height: 52px; justify-content: center; border-radius: 18px; }
.chip.emo.on { background: var(--grad); }
.chip.add { border: 2px dashed var(--line); box-shadow: none; background: transparent; color: var(--muted); }
.srow { display: flex; align-items: center; gap: 10px; padding: 7px 0; }
.srow .nm { flex: 1; min-width: 0; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.srow .in { width: 110px; padding: 9px 10px; text-align: center; direction: ltr; }
.step { display: flex; align-items: center; gap: 4px; }
.step button { width: 40px; height: 40px; border-radius: 14px; background: var(--card); box-shadow: var(--shadow); font-size: 20px; font-weight: 700; transition: transform .2s var(--spring); }
.step button:active { transform: scale(.88); }
.step b { width: 26px; text-align: center; font-family: var(--fd); }
.hint { font-size: 14px; margin-top: 8px; text-align: center; color: var(--muted); }
.acts { display: flex; gap: 10px; margin-top: 22px; }
.acts .btn.wide { flex: 1; }
.sw { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 4px; border-bottom: 1px solid var(--line); width: 100%; text-align: start; font-size: 16px; }
.sw small { display: block; color: var(--muted); font-size: 12.5px; }
.sw i { width: 52px; height: 32px; border-radius: 32px; background: var(--line); position: relative; transition: background .2s; flex: none; }
.sw i::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: transform .3s var(--spring); box-shadow: 0 1px 4px rgba(0, 0, 0, .3); }
.sw.on i { background: var(--pos); } .sw.on i::after { transform: translateX(-20px); }
.shake { animation: shake .35s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
.toast {
  position: fixed; inset-inline: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 96px); margin: 0 auto; width: max-content; max-width: 88vw; z-index: 40;
  background: var(--ink); color: var(--bg); padding: 12px 20px; border-radius: 99px; font-weight: 600; opacity: 0; transform: translateY(14px) scale(.95);
  transition: .3s var(--spring); pointer-events: none; text-align: center; box-shadow: 0 10px 30px rgba(0, 0, 0, .25);
}
.toast.on { opacity: 1; transform: none; }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="shell" id="app"></div>
<div id="sheetHost"></div>
<div class="toast" id="toast" role="status"></div>
<canvas id="fx"></canvas>

<script>
/* חצי־חצי — expense splitting between friends. Local groups stay on this device (localStorage); shared groups sync through Firestore.
   Money is kept in minor units (integers). Every expense keeps its own currency and the exchange rate used when it was entered,
   and all balances are computed in the group's main currency. */
(() => {
  "use strict";
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const uid = () => Math.random().toString(36).slice(2, 10);
  const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };

  const CATS = [
    ["food", "🍽️", "אוכל", "#ff7a45"], ["market", "🛒", "סופר", "#12b886"], ["home", "🏠", "דיור", "#7950f2"], ["ride", "🚗", "נסיעות", "#2f9bff"],
    ["fuel", "⛽", "דלק", "#c2703d"], ["fun", "🎉", "בילוי", "#e64980"], ["flight", "✈️", "טיסות", "#15aabf"], ["stay", "🏨", "לינה", "#f59f00"],
    ["bills", "💡", "חשבונות", "#82c91e"], ["gift", "🎁", "מתנות", "#be4bdb"], ["gear", "📷", "ציוד", "#5c677d"], ["other", "📦", "אחר", "#a39fb5"],
  ];
  const CAT = Object.fromEntries(CATS.map((c) => [c[0], { emoji: c[1], label: c[2], color: c[3] }]));
  const EMOJIS = ["🏝️", "🏠", "✈️", "🍕", "🎬", "🎉", "🚗", "🏕️", "💼", "📷", "⚽", "❤️"];
  const COLORS = ["#6a4dff", "#ff5c8a", "#12b886", "#ff9f1a", "#2f9bff", "#e64980", "#7950f2", "#20c997"];
  const GRADS = [["#6a4dff", "#b44dff"], ["#ff5c8a", "#ff9f1a"], ["#12b886", "#2f9bff"], ["#2f9bff", "#6a4dff"], ["#e64980", "#b44dff"], ["#ff9f1a", "#ff5c8a"]];
  const CURS = [
    ["ILS", "₪", "שקל", "🇮🇱"], ["USD", "$", "דולר", "🇺🇸"], ["EUR", "€", "אירו", "🇪🇺"], ["GBP", "£", "ליש״ט", "🇬🇧"], ["THB", "฿", "באט", "🇹🇭"],

      S.groups.unshift({ id: uid(), name: "טיול לתאילנד", emoji: "🏝️", cur: "ILS", curs: ["THB", "USD"], me, members: [{ id: me, name: S.name || "אני" }, { id: a, name: "דנה" }, { id: b, name: "יובל" }, { id: c, name: "נועה" }],
        tx: [x("טיסות", "flight", 7200, me), x("מלון בקו סמוי", "stay", 480, a, "USD", 3.7), x("ארוחת ערב על החוף", "food", 2400, b, "THB", 0.11, "shares", { [me]: 1, [a]: 1, [b]: 2, [c]: 1 }),
          x("סירה לאיים", "fun", 3600, c, "THB", 0.11), x("מונית לשדה", "ride", 180, a, null, null, "equal", { [me]: 1, [a]: 1, [b]: 1 })] });
      save(); render(); FX("coin");
    },
  };

  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-a]"); if (!el) return;
    const fn = A[el.dataset.a]; if (fn) fn(el, e);
  });
  document.addEventListener("input", (e) => {
    const t = e.target; if (!D) return;
    if (t.id === "xDesc") D.desc = t.value;
    else if (t.id === "xDate") D.date = t.value;
    else if (t.id === "xRateIn") { D.rate = t.value.replace(",", "."); D.rateAuto = false; drawRateHint(); }
    else if (t.dataset.i === "xExact") { D.exact[t.dataset.v] = t.value; drawLeft(); }
  });
  document.addEventListener("focusin", (e) => { // typing in another field folds the keypad away
    if (D && D.kind === "exp" && D.pad && e.target.matches("input")) { D.pad = false; drawAmt(); }
  });
  document.addEventListener("change", (e) => {
    if (e.target.id !== "imp" || !e.target.files[0]) return;
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const d = JSON.parse(fr.result);
        if (!d || !Array.isArray(d.groups) || !d.groups.every((g) => g.id && Array.isArray(g.members) && Array.isArray(g.tx))) throw 0;
        S = { v: 1, sound: true, haptic: true, ...d, groups: [...S.groups.filter((g) => g.cloud), ...d.groups.filter((g) => !g.cloud).map(fixGroup)] }; save();
        closeSheet(); location.hash = ""; render(); FX("coin"); toast("הנתונים שוחזרו");
      } catch (err) { fail("קובץ הגיבוי לא תקין"); }
    };
    fr.readAsText(e.target.files[0]);
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && sheetOpen) return A.close();
    if (e.key === "Enter" && e.target.id === "gAdd") { e.preventDefault(); return A.gAddMem(); }
    if (e.key === "Enter" && e.target.id === "sAdd") { e.preventDefault(); return A.sAddMem(); }
    // a hardware keyboard drives the keypad too
    if (D && (D.kind === "pay" || (D.kind === "exp" && D.pad)) && !e.target.matches("input") && !e.metaKey && !e.ctrlKey) {
      if (/^[0-9]$/.test(e.key) || e.key === ".") keyPress(e.key);
      else if (e.key === "Backspace") keyPress("⌫");
    }
  });

  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
  route();
  initCloud();
})();
</script>
