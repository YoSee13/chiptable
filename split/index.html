<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>חצי־חצי</title>
<meta name="description" content="מחלקים הוצאות בין חברים: קבוצות, הוצאות, יתרות וסגירת חשבון במינימום העברות.">
<meta name="theme-color" content="#f6f0e4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16151b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="חצי־חצי">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Secular+One&display=swap">
<style>
/* One mobile column on "receipt paper"; bottom sheets for every form; all colors are tokens with a dark variant. */
:root {
  --bg: #f6f0e4; --bg-2: #efe7d7; --card: #fffdf8; --line: #e4dac6;
  --ink: #1d1b22; --muted: #7a7466; --accent: #ff6a3d; --accent-ink: #fff;
  --pos: #178a5c; --pos-bg: #dcf3e6; --neg: #d1345b; --neg-bg: #fbe1e7;
  --hero: #1d1b22; --hero-ink: #fbf6ea; --shadow: 0 6px 22px rgba(60, 45, 20, .10);
  --f: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
  --fd: "Secular One", "Rubik", system-ui, sans-serif;
  --r: 18px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16151b; --bg-2: #1e1d25; --card: #23222b; --line: #34323e;
    --ink: #f4efe4; --muted: #a19b8d; --accent: #ff7a4f; --accent-ink: #1d1108;
    --pos: #5fd6a0; --pos-bg: #173328; --neg: #ff7d98; --neg-bg: #3b1a25;
    --hero: #2b2a35; --hero-ink: #fbf6ea; --shadow: 0 6px 22px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f); font-size: 16px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.n { direction: ltr; unicode-bidi: isolate; display: inline-block; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.pos { color: var(--pos); } .neg { color: var(--neg); }

.shell {
  max-width: 560px; margin: 0 auto; min-height: 100%;
  padding: calc(env(safe-area-inset-top, 0px) + 14px) max(16px, env(safe-area-inset-right, 0px)) 130px max(16px, env(safe-area-inset-left, 0px));
}
.top { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; min-height: 44px; }
.top h1 { font-family: var(--fd); font-weight: 400; font-size: 28px; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.logo { display: inline-flex; align-items: center; gap: 8px; }
.logo i { width: 30px; height: 30px; border-radius: 50%; background: conic-gradient(var(--accent) 0 50%, var(--ink) 50% 100%); display: inline-block; transform: rotate(-20deg); }
.ib {
  width: 44px; height: 44px; border-radius: 14px; background: var(--card); border: 1px solid var(--line);
  display: grid; place-items: center; font-size: 19px; flex: none; transition: transform .12s;
}
.ib:active, .btn:active, .fab:active, .chip:active, .row:active, .gcard:active { transform: scale(.96); }

/* hero "ticket" */
.hero {
  background: var(--hero); color: var(--hero-ink); border-radius: 22px 22px 0 0; padding: 22px 22px 34px; margin-bottom: 20px;
  -webkit-mask: radial-gradient(circle 7px at 50% 100%, #0000 97%, #000) 50% 0 / 20px 100%;
  mask: radial-gradient(circle 7px at 50% 100%, #0000 97%, #000) 50% 0 / 20px 100%;
}
.hero small { opacity: .7; font-size: 14px; }
.hero .big { font-family: var(--fd); font-size: 52px; line-height: 1.1; margin: 4px 0 2px; }
.hero .big.p { color: #7be3b1; } .hero .big.m { color: #ff93a9; }
.hero .split { display: flex; gap: 18px; margin-top: 12px; padding-top: 12px; border-top: 1px dashed rgba(255,255,255,.25); font-size: 14px; }
.hero .split b { display: block; font-size: 18px; font-weight: 600; }

h2 { font-size: 15px; font-weight: 600; color: var(--muted); margin: 22px 4px 10px; letter-spacing: .02em; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); }

.gcard {
  display: flex; align-items: center; gap: 14px; width: 100%; text-align: start; background: var(--card); border: 1px solid var(--line);
  border-radius: var(--r); padding: 14px; margin-bottom: 10px; box-shadow: var(--shadow); transition: transform .12s;
  animation: rise .35s both; animation-delay: calc(var(--i, 0) * 45ms);
}
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
.tile { width: 50px; height: 50px; border-radius: 15px; display: grid; place-items: center; font-size: 25px; flex: none; background: var(--bg-2); }
.gcard .mid { flex: 1; min-width: 0; }
.gcard .mid b { display: block; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gcard .mid span { font-size: 13px; color: var(--muted); }
.pill { font-size: 13px; font-weight: 600; padding: 5px 10px; border-radius: 99px; background: var(--bg-2); color: var(--muted); white-space: nowrap; text-align: center; }
.pill.pos { background: var(--pos-bg); color: var(--pos); } .pill.neg { background: var(--neg-bg); color: var(--neg); }
.pill small { display: block; font-weight: 400; font-size: 11px; }

.fab {
  position: fixed; inset-inline: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); margin: 0 auto; width: max-content;
  background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 17px; padding: 15px 26px; border-radius: 99px;
  box-shadow: 0 10px 26px rgba(255, 106, 61, .45); z-index: 5; transition: transform .12s;
}
.empty { text-align: center; padding: 30px 10px; color: var(--muted); }
.empty svg { width: 150px; height: auto; margin-bottom: 8px; }
.empty b { display: block; color: var(--ink); font-size: 19px; margin-bottom: 4px; }

/* group */
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.stat small { color: var(--muted); font-size: 13px; display: block; }
.stat b { font-family: var(--fd); font-weight: 400; font-size: 26px; }
.tabs { display: flex; background: var(--bg-2); border-radius: 14px; padding: 4px; margin-bottom: 14px; }
.tabs button { flex: 1; padding: 10px 4px; border-radius: 11px; font-weight: 600; color: var(--muted); font-size: 15px; }
.tabs button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.12); }
.day { font-size: 13px; color: var(--muted); margin: 16px 4px 6px; }
.row {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: start; padding: 11px 12px; background: var(--card);
  border: 1px solid var(--line); border-radius: 16px; margin-bottom: 8px; transition: transform .12s; animation: rise .3s both; animation-delay: calc(var(--i, 0) * 30ms);
}
.row .tile { width: 44px; height: 44px; font-size: 21px; border-radius: 13px; }
.row .mid { flex: 1; min-width: 0; }
.row .mid b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .mid span, .row .end span { font-size: 13px; color: var(--muted); }
.row .end { text-align: end; flex: none; }
.row .end b { display: block; font-weight: 700; }
.row.pay { background: transparent; border-style: dashed; }

.av { width: 34px; height: 34px; border-radius: 50%; display: inline-grid; place-items: center; color: #fff; font-weight: 700; font-size: 15px; flex: none; }
.brow { display: flex; align-items: center; gap: 10px; padding: 9px 0; }
.brow .mid { flex: 1; min-width: 0; }
.brow .nm { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; font-size: 15px; }
.track { height: 9px; background: var(--bg-2); border-radius: 9px; margin-top: 5px; overflow: hidden; }
.track i { display: block; height: 100%; border-radius: 9px; width: 0; transition: width .7s cubic-bezier(.2,.8,.2,1); }
.tr { display: flex; align-items: center; gap: 8px; padding: 12px 0; border-top: 1px solid var(--line); }
.tr:first-child { border-top: 0; }
.tr .who { flex: 1; min-width: 0; font-size: 15px; line-height: 1.3; }
.tr .who b { font-family: var(--fd); font-weight: 400; font-size: 20px; display: block; }
.arrow { color: var(--muted); font-size: 18px; }
.btn { background: var(--ink); color: var(--bg); font-weight: 600; padding: 11px 16px; border-radius: 13px; transition: transform .12s; white-space: nowrap; }
.btn.acc { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: var(--bg-2); color: var(--ink); }
.btn.danger { background: var(--neg-bg); color: var(--neg); }
.btn.wide { width: 100%; padding: 15px; font-size: 17px; border-radius: 16px; }
.btn.sm { padding: 8px 12px; font-size: 14px; }

.donut { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; justify-content: center; }
.donut svg { width: 170px; height: 170px; flex: none; }
.donut circle { transition: stroke-dasharray .8s cubic-bezier(.2,.8,.2,1); }
.legend { flex: 1; min-width: 150px; font-size: 14px; }
.legend div { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
.legend i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.legend span { flex: 1; }

/* sheets */
.back { position: fixed; inset: 0; background: rgba(15, 12, 8, .5); z-index: 20; opacity: 0; transition: opacity .25s; }
.back.on { opacity: 1; }
.sheet {
  position: fixed; inset: auto 0 0 0; margin: 0 auto; max-width: 560px; max-height: 92dvh; overflow-y: auto; z-index: 21; background: var(--bg);
  border-radius: 26px 26px 0 0; padding: 10px 18px calc(env(safe-area-inset-bottom, 0px) + 22px); transform: translateY(105%);
  transition: transform .32s cubic-bezier(.2,.9,.25,1); overscroll-behavior: contain;
}
.sheet.on { transform: none; }
.sheet::before { content: ""; display: block; width: 44px; height: 5px; border-radius: 5px; background: var(--line); margin: 0 auto 12px; }
.sheet h3 { font-family: var(--fd); font-weight: 400; font-size: 24px; margin: 0 0 14px; display: flex; align-items: center; justify-content: space-between; }
.sheet label, .lbl { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 16px 2px 7px; }
.in {
  width: 100%; background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 13px 14px; font-size: 16px; outline: 0;
}
.in:focus { border-color: var(--accent); }
.amt { display: flex; align-items: baseline; justify-content: center; gap: 6px; direction: ltr; padding: 8px 0 4px; }
.amt span { font-family: var(--fd); font-size: 34px; color: var(--muted); }
.amt input {
  font-family: var(--fd); font-size: 60px; width: 5.2ch; min-width: 2ch; text-align: center; background: none; border: 0; outline: 0; padding: 0;
  border-bottom: 3px dashed var(--line); border-radius: 0; caret-color: var(--accent);
}
.amt input:focus { border-color: var(--accent); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; margin-inline: -18px; padding-inline: 18px; scrollbar-width: none; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 7px; background: var(--card); border: 1.5px solid var(--line); border-radius: 99px;
  padding: 8px 13px; font-weight: 500; white-space: nowrap; transition: transform .12s, background .15s; flex: none;
}
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip .av { width: 22px; height: 22px; font-size: 11px; }
.chip.emo { font-size: 24px; padding: 8px; width: 50px; height: 50px; justify-content: center; border-radius: 15px; }
.chip.emo.on { background: var(--accent); border-color: var(--accent); }
.seg { display: flex; background: var(--bg-2); border-radius: 13px; padding: 4px; }
.seg button { flex: 1; padding: 9px 4px; border-radius: 10px; font-weight: 600; color: var(--muted); font-size: 14px; }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.12); }
.srow { display: flex; align-items: center; gap: 10px; padding: 7px 0; }
.srow .nm { flex: 1; min-width: 0; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.srow .in { width: 110px; padding: 9px 10px; text-align: center; direction: ltr; }
.step { display: flex; align-items: center; gap: 4px; }
.step button { width: 38px; height: 38px; border-radius: 12px; background: var(--card); border: 1.5px solid var(--line); font-size: 20px; font-weight: 700; }
.step b { width: 26px; text-align: center; }
.hint { font-size: 14px; margin-top: 8px; text-align: center; color: var(--muted); }
.acts { display: flex; gap: 10px; margin-top: 22px; }
.acts .btn.wide { flex: 1; }
.sw { display: flex; align-items: center; justify-content: space-between; padding: 13px 0; border-bottom: 1px solid var(--line); width: 100%; text-align: start; font-size: 16px; }
.sw i { width: 50px; height: 30px; border-radius: 30px; background: var(--line); position: relative; transition: background .2s; flex: none; }
.sw i::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.sw.on i { background: var(--pos); } .sw.on i::after { transform: translateX(-20px); }
.shake { animation: shake .35s; }
@keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }
.toast {
  position: fixed; inset-inline: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 90px); margin: 0 auto; width: max-content; max-width: 88vw; z-index: 40;
  background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 99px; font-weight: 500; opacity: 0; transform: translateY(12px);
  transition: .25s; pointer-events: none; text-align: center;
}
.toast.on { opacity: 1; transform: none; }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="shell" id="app"></div>
<div id="sheetHost"></div>
<div class="toast" id="toast" role="status"></div>
<canvas id="fx"></canvas>

<script>
/* חצי־חצי — expense splitting between friends. Local groups stay on this device (localStorage); shared groups sync through Firestore. Money is kept in agorot (integers). */
(() => {
  "use strict";
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const uid = () => Math.random().toString(36).slice(2, 10);
  const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };

  const CATS = [
    ["food", "🍽️", "אוכל", "#ff6a3d"], ["market", "🛒", "סופר", "#2a9d8f"], ["home", "🏠", "דיור", "#7b5cff"], ["ride", "🚗", "נסיעות", "#2f80ed"],
    ["fuel", "⛽", "דלק", "#b0603a"], ["fun", "🎉", "בילוי", "#e0457b"], ["flight", "✈️", "טיסות", "#18a5c9"], ["stay", "🏨", "לינה", "#e9a100"],
    ["bills", "💡", "חשבונות", "#8a9a2b"], ["gift", "🎁", "מתנות", "#c046c9"], ["gear", "📷", "ציוד", "#5a6478"], ["other", "📦", "אחר", "#9c9484"],
  ];
  const CAT = Object.fromEntries(CATS.map((c) => [c[0], { emoji: c[1], label: c[2], color: c[3] }]));
  const EMOJIS = ["🏕️", "🏠", "✈️", "🍕", "🎬", "🎉", "🚗", "🏖️", "💼", "📷", "⚽", "❤️"];
  const COLORS = ["#ff6a3d", "#2a9d8f", "#7b5cff", "#e9a100", "#e0457b", "#2f80ed", "#3aa655", "#b0603a"];
  const CURS = ["₪", "$", "€"];

  /* ---------- store ---------- */
  const KEY = "hetzi-data-v1";
  let S = (() => {
    try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && Array.isArray(d.groups)) return d; } catch (e) {}
    return { v: 1, groups: [], sound: true, haptic: true };
  })();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

  /* ---------- sound + haptics ---------- */
  const FX = (() => {
    let ctx, hx;
    const ac = () => {
      if (!ctx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ctx = new C(); }
      if (ctx.state === "suspended") ctx.resume();
      return ctx;
    };
    const tone = (f, at, dur, type = "sine", vol = 0.1, f2) => {
      const c = ac(); if (!c) return;
      const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + at;
      o.type = type; o.frequency.setValueAtTime(f, t);
      if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + 0.03);
    };
    const SND = {
      tap: () => tone(680, 0, 0.05, "sine", 0.06),
      pick: () => tone(520, 0, 0.06, "triangle", 0.08, 780),
      open: () => tone(330, 0, 0.12, "sine", 0.05, 520),
      close: () => tone(520, 0, 0.1, "sine", 0.04, 330),
      coin: () => { tone(988, 0, 0.09, "square", 0.05); tone(1319, 0.08, 0.32, "square", 0.05); },
      settle: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * 0.09, 0.35, "triangle", 0.11)),
      del: () => tone(320, 0, 0.22, "sawtooth", 0.05, 110),
      err: () => { tone(150, 0, 0.1, "square", 0.06); tone(120, 0.13, 0.14, "square", 0.06); },
    };
    const VIB = { tap: 8, pick: 12, open: 10, close: 6, coin: [12, 40, 24], settle: [18, 50, 18, 50, 40], del: 30, err: [45, 60, 45] };
    // iOS Safari has no vibrate(); toggling a hidden "switch" checkbox produces the system haptic tick on recent versions.
    const iosTick = () => {
      if (!hx) {
        hx = document.createElement("label");
        hx.setAttribute("aria-hidden", "true");
        hx.style.cssText = "position:fixed;left:-99px;top:0;opacity:0;pointer-events:none";
        hx.innerHTML = '<input type="checkbox" switch tabindex="-1">';
        document.body.appendChild(hx);
      }
      hx.click();
    };
    return (name) => {
      if (S.sound) try { SND[name](); } catch (e) {}
      if (S.haptic) try { navigator.vibrate ? navigator.vibrate(VIB[name]) : iosTick(); } catch (e) {}
    };
  })();

  /* ---------- money + math ---------- */
  const fmt = (a, cur) => `<span class="n">${cur}${(Math.abs(a) / 100).toLocaleString("en-US", { minimumFractionDigits: a % 100 ? 2 : 0, maximumFractionDigits: 2 })}</span>`;
  const plain = (a, cur) => cur + (Math.abs(a) / 100).toLocaleString("en-US", { minimumFractionDigits: a % 100 ? 2 : 0, maximumFractionDigits: 2 });
  const parse = (s) => { const x = parseFloat(String(s).replace(",", ".")); return isFinite(x) && x > 0 ? Math.round(x * 100) : 0; };

  // How much each participant owes for one expense, in agorot, always summing exactly to tx.amt.
  function owed(tx) {
    const ids = Object.keys(tx.parts), out = {};
    if (tx.mode === "exact") { ids.forEach((i) => (out[i] = tx.parts[i])); return out; }
    const w = ids.map((i) => (tx.mode === "shares" ? tx.parts[i] : 1)), W = w.reduce((a, b) => a + b, 0);
    if (!W) return out;
    let rest = tx.amt;
    ids.forEach((id, k) => { out[id] = Math.floor((tx.amt * w[k]) / W); rest -= out[id]; });
    for (let k = 0; rest > 0; k = (k + 1) % ids.length) if (w[k] > 0) { out[ids[k]]++; rest--; }
    return out;
  }
  function nets(g) {
    const net = Object.fromEntries(g.members.map((m) => [m.id, 0]));
    for (const tx of g.tx) {
      if (tx.type === "pay") { net[tx.by] += tx.amt; net[tx.to] -= tx.amt; continue; }
      net[tx.by] += tx.amt;
      const o = owed(tx); for (const id in o) net[id] -= o[id];
    }
    return net;
  }
  // Fewest-ish transfers: repeatedly match the biggest debtor with the biggest creditor.
  function transfers(net) {
    const cr = [], db = [];
    for (const [id, v] of Object.entries(net)) { if (v > 0) cr.push({ id, v }); else if (v < 0) db.push({ id, v: -v }); }
    const out = [];

      if (!confirmTwice(el, g.cloud && !g.owner ? "לצאת? לחצו שוב" : g.cloud ? "למחוק לכולם? לחצו שוב" : "למחוק הכול? לחצו שוב")) return;
      if (g.cloud) (g.owner ? C.F.deleteDoc(ref(g.id)) : C.F.updateDoc(ref(g.id), { uids: C.F.arrayRemove(U.uid), ["who." + U.uid]: C.F.deleteField() })).catch(cloudErr);
      S.groups = S.groups.filter((g) => g.id !== R.gid); save(); closeSheet(); FX("del"); toast(g.cloud && !g.owner ? "יצאת מהקבוצה" : "הקבוצה נמחקה"); location.hash = "";
    },

    settings() {
      FX("open"); D = { kind: "set" };
      sheet(`<h3>הגדרות</h3>
        ${U ? `<div class="card">☁️ מחובר/ת: <b>${esc(U.name)}</b><div class="muted" style="font-size:13px" dir="ltr">${esc(U.email)}</div>
          <div class="acts" style="margin-top:10px"><button class="btn ghost sm" data-a="signOut">התנתקות</button></div></div>`
        : `<div class="card"><b>☁️ סנכרון בענן</b><div class="muted" style="font-size:14px">מתחברים עם Google כדי לשתף קבוצות עם חברים ולראות אותן בכל המכשירים.</div>
          <div class="acts" style="margin-top:10px"><button class="btn acc wide" data-a="signIn">התחברות עם Google</button></div></div>`}
        <button class="sw ${S.sound ? "on" : ""}" data-a="tSound" role="switch" aria-checked="${S.sound}">🔊 צלילים<i></i></button>
        <button class="sw ${S.haptic ? "on" : ""}" data-a="tHaptic" role="switch" aria-checked="${S.haptic}">📳 רטט (הפטיקס)<i></i></button>
        <div class="hint" style="text-align:start">קבוצות בלי ☁️ נשמרות במכשיר הזה בלבד. הגיבוי כולל רק אותן.</div>
        <div class="acts"><button class="btn ghost wide" data-a="export">⬇️ גיבוי</button><button class="btn ghost wide" data-a="import">⬆️ שחזור</button></div>
        <input type="file" id="imp" accept="application/json,.json" hidden>`);
    },
    tSound(el) { S.sound = !S.sound; save(); el.classList.toggle("on", S.sound); el.setAttribute("aria-checked", S.sound); FX("pick"); },
    tHaptic(el) { S.haptic = !S.haptic; save(); el.classList.toggle("on", S.haptic); el.setAttribute("aria-checked", S.haptic); FX("coin"); },
    export() {
      FX("tap"); const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([JSON.stringify({ ...S, groups: S.groups.filter((g) => !g.cloud) }, null, 2)], { type: "application/json" }));
      a.download = `hetzi-hetzi-${today()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    },
    import() { FX("tap"); $("#imp").click(); },
    demo() {
      const ids = [uid(), uid(), uid(), uid()], [me, a, b, c] = ids, all = { [me]: 1, [a]: 1, [b]: 1, [c]: 1 }, d = today();
      const x = (desc, cat, amt, by, mode = "equal", parts = all) => ({ id: uid(), type: "exp", desc, cat, amt: amt * 100, by, mode, parts, date: d, ts: String(Date.now() + Math.random()) });
      S.groups.unshift({ id: uid(), name: "טיול לצפון", emoji: "🏕️", cur: "₪", me, members: [{ id: me, name: S.name || "אני" }, { id: a, name: "דנה" }, { id: b, name: "יובל" }, { id: c, name: "נועה" }],
        tx: [x("צימר בגליל", "stay", 1600, me), x("דלק", "fuel", 320, a), x("ארוחת ערב", "food", 540, b, "shares", { [me]: 1, [a]: 1, [b]: 2, [c]: 1 }), x("קניות לסופ״ש", "market", 410, a), x("קיאקים", "fun", 360, c, "equal", { [me]: 1, [b]: 1, [c]: 1 })] });
      save(); render(); FX("coin");
    },
  };

  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-a]"); if (!el) return;
    const fn = A[el.dataset.a]; if (fn) fn(el, e);
  });
  document.addEventListener("input", (e) => {
    const t = e.target; if (!D) return;
    if (t.id === "xAmt") { D.amt = t.value; t.style.width = Math.max(2, t.value.length + 0.4) + "ch"; drawSplit(); }
    else if (t.id === "xDesc") D.desc = t.value;
    else if (t.id === "xDate") D.date = t.value;
    else if (t.dataset.i === "xExact") { D.exact[t.dataset.v] = t.value; drawLeft(); }
  });
  document.addEventListener("change", (e) => {
    if (e.target.id !== "imp" || !e.target.files[0]) return;
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const d = JSON.parse(fr.result);
        if (!d || !Array.isArray(d.groups) || !d.groups.every((g) => g.id && Array.isArray(g.members) && Array.isArray(g.tx))) throw 0;
        S = { v: 1, sound: true, haptic: true, ...d, groups: [...S.groups.filter((g) => g.cloud), ...d.groups.filter((g) => !g.cloud)] }; save(); closeSheet(); location.hash = ""; render(); FX("coin"); toast("הנתונים שוחזרו");
      } catch (err) { fail("קובץ הגיבוי לא תקין"); }
    };
    fr.readAsText(e.target.files[0]);
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && host.firstChild) A.close();
    if (e.key === "Enter" && e.target.id === "gAdd") { e.preventDefault(); A.gAddMem(); }
    if (e.key === "Enter" && e.target.id === "sAdd") { e.preventDefault(); A.sAddMem(); }
  });

  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
  route();
  initCloud();
})();
</script>
</body>
</html>
